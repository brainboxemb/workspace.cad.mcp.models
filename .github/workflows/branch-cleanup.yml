name: Branch cleanup

on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  post_merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - name: Remove merged temporary source branch
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/branch-cleanup/src
        run: >-
          python -m cad_mcp_workspace_branch_cleanup
          --repository "${{ github.repository }}"
          post-merge
          --head "${{ github.event.pull_request.head.ref }}"
          --base "${{ github.event.pull_request.base.ref }}"
          --head-repository "${{ github.event.pull_request.head.repo.full_name }}"
          --merged

  sweep:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.body == '/cleanup-branches' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - name: Sweep merged temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/branch-cleanup/src
        run: >-
          python -m cad_mcp_workspace_branch_cleanup
          --repository "${{ github.repository }}" sweep
